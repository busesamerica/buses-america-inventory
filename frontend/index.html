<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buses America - Sistema de Inventario</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- API Configuration -->
    <script>
        // Backend API URL - Update this with your Render backend URL
        window.API_BASE_URL = 'https://buses-america.onrender.com';
        // Logo path
        window.LOGO_PATH = './logo.png';
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Loading spinner */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: #FFD700;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div>Cargando Buses America...</div>
        </div>
    </div>
    
    <!-- Load CSS -->
    <link rel="stylesheet" href="./App.css">

    <!-- Load React app -->
<script src="./PreInspectionForm.jsx" type="text/babel"></script>
<script src="./PreInspectionReport.jsx" type="text/babel"></script>
<script src="./PreInspectionsList.jsx" type="text/babel"></script>
<script src="./InspectionBadge.jsx" type="text/babel"></script>
<script src="./CreateInventoryModal.jsx" type="text/babel"></script>
<script src="./CostManagementModal.jsx" type="text/babel"></script>
<script src="./SalesModal.jsx" type="text/babel"></script>
<script src="./SalesReports.jsx" type="text/babel"></script>
<script src="./TransactionJournal.jsx" type="text/babel"></script>
<script src="./AccountingDashboard.jsx" type="text/babel"></script>
<script src="./ProfitDistributionModal.jsx" type="text/babel"></script>
<script src="./TransactionEntryModal.jsx" type="text/babel"></script>
<script src="./DistributionHistoryModal.jsx" type="text/babel"></script>
<script src="./IncomeStatementReport.jsx" type="text/babel"></script>
<script src="./BalanceSheetReport.jsx" type="text/babel"></script>
<script src="./PeriodClosingModal.jsx" type="text/babel"></script>
<script src="./SalesManagement.jsx" type="text/babel"></script>
<script src="./InventoryManagement.jsx" type="text/babel"></script>
<script src="./ClientModals.jsx" type="text/babel"></script>
<script src="./ClientManagement.jsx" type="text/babel"></script>
<script type="text/babel" src="./App_COMPLETE.jsx"></script>
    
    <script type="text/babel">
        // Render the app once loaded
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
