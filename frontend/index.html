<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buses America - Sistema de Inventario</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- API Configuration -->
    <script>
        // Backend API URL - Update this with your Render backend URL
        window.API_BASE_URL = 'https://buses-america.onrender.com';
        // Logo path
        window.LOGO_PATH = './logo.png';
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Loading spinner */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: #FFD700;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div>Cargando Buses America...</div>
        </div>
    </div>
    
    <!-- Load CSS -->
    <link rel="stylesheet" href="./App.css">
    
    <!-- Load and render React app -->
    <script type="text/babel" src="./App_COMPLETE.jsx"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Import the App component from App_COMPLETE.jsx
        // (It will be available globally after the script loads)
        
        // Wait for App to be defined, then render
        function renderApp() {
            if (typeof App !== 'undefined') {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App apiBaseUrl={window.API_BASE_URL} />);
            } else {
                setTimeout(renderApp, 100);
            }
        }
        
        // Start rendering once DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderApp);
        } else {
            renderApp();
        }
    </script>
</body>
</html>
