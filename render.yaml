 services:
  # Web Service - FastAPI Application
  - type: web
    name: buses-america
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python init_database.py
      python migrate.py || echo "WARNING: migrations failed - some features will be unavailable until they're applied"
    startCommand: uvicorn backend_api_FINAL:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buses-america-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: ALLOWED_ORIGINS
        value: https://buses-america-ui.onrender.com
      # AI-generated Dashboard briefing (ai_briefing.py) needs a real
      # Anthropic API key - set the value in the Render dashboard after
      # deploying (sync: false leaves it blank here rather than
      # auto-generating one, since this one has to be a real key from
      # https://console.anthropic.com/). Left unset, the app runs fine and
      # the briefing card just shows "not set up yet" instead of erroring.
      - key: ANTHROPIC_API_KEY
        sync: false
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: buses-america-db
    plan: free
    databaseName: buses_america
    user: buses_america_user
